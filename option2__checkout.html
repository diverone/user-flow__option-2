<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apmokėjimas</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="booking-static.css" />
  <style>
    /* ══════════════════════════════════════════════════════════════════
       PAGE-SPECIFIC — checkout (mini summary + contact details + payment)
       Reached straight from user__booking-time.html's time step (booking
       selection carried via query string: format/service/specialist/date/
       time/duration/price — see the deep-link script below). No separate
       summary/details step anymore — this page owns all three: recap,
       contact fields, payment. Shared shell/components (tokens, card,
       header, footer, compact query, .text-input, .pay-btn, .divider,
       .stack-btns/.stack-btn) live in style.css.
       ══════════════════════════════════════════════════════════════════ */

    .back-btn { display: flex; }

    /* No profile photo on this page's header, but keep the same overall
       header height as the other pages (which do have the photo). */
    .profile {
      min-height: 176px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* specialist photo to the left of name+service, instead of stacked/centered */
    .checkout-header-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .checkout-header-top .profile__photo,
    .checkout-header-top .profile__initials {
      width: 40px;
      height: 40px;
      margin: 0;
    }

    /* ── HEADER TIME/DATE: centered, right under the tagline ── */
    .profile__time {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
    }

    .profile__time-value {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--cal-navy);
    }

    .profile__time-sep {
      width: 1px;
      height: 18px;
      background: var(--border);
    }

    .profile__time-date {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--cal-navy);
    }

    .profile__time-date svg { color: var(--cal-blue); flex-shrink: 0; }

    #checkout-header-service {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }

    #checkout-header-service svg { color: var(--cal-blue); flex-shrink: 0; }

    .profile__duration {
      display: block;
      font-size: 12px;
      color: var(--cal-slate);
      margin-top: 4px;
    }

    .checkout-header-price {
      display: block;
      font-size: 17px;
      font-weight: 700;
      color: var(--cal-navy);
      margin-top: 10px;
    }

    /* ── MINI SUMMARY: only the specialist+format line — everything else
       (service, time/date, price) moved up into the header above. ── */
    .checkout__summary { width: 100%; text-align: left; }

    .checkout__summary-specialist {
      display: block;
      font-size: 12px;
      color: var(--cal-slate);
    }

    .checkout__consent {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      text-align: left;
      padding: 4px 2px;
    }

    .checkout__consent input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin-top: 2px;
      accent-color: var(--cal-blue);
      flex-shrink: 0;
      cursor: pointer;
    }

    .checkout__consent label {
      font-size: 12px;
      color: var(--cal-slate);
    }

    .checkout__consent a { color: var(--cal-blue-text); }

    .checkout {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      padding: 24px 32px 32px;
    }

    .checkout__step { width: 100%; }
    .checkout__step--success { display: none; text-align: center; }
    .checkout[data-state="success"] .checkout__step--form { display: none; }
    .checkout[data-state="success"] .checkout__step--success { display: block; }

    .checkout__success-icon { font-size: 36px; margin-bottom: 12px; }

    .checkout__subtitle {
      font-size: 13px;
      color: var(--cal-slate);
      max-width: 280px;
      margin: 0 auto;
    }

    .checkout__booking-meta {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 5px;
      margin-bottom: 20px;
      white-space: nowrap;
    }

    .checkout__booking-label {
      font-size: 12px;
      font-weight: 400;
      color: var(--cal-slate);
    }

    .checkout__booking-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--cal-navy);
    }

    .checkout__booking-separator {
      margin: 0 3px;
      color: var(--subtle);
    }

.checkout__divider {
      margin: 18px 0;
    }

    .checkout__section-title {
      margin-bottom: 18px;
      font-size: 15px;
      font-weight: 700;
      color: var(--cal-navy);
      text-align: left;
    }

    .checkout__contact-fields {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .checkout__contacts {
      display: none;
      margin-top: 24px;
    }

    .checkout__payment-section {
      margin-top: 0;
    }

    .checkout__payment-methods {
      min-width: 0;
      padding: 0;
      border: 0;
    }

    .checkout__payment-method {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border-mid);
      border-radius: 10px;
      background: #fff;
    }

    .checkout__payment-method + .checkout__payment-method {
      margin-top: 8px;
    }

    .checkout__payment-row {
      display: flex;
      gap: 8px;
    }

    .checkout__payment-row + .checkout__payment-method {
      margin-top: 8px;
    }

    .checkout__payment-row .checkout__payment-method {
      flex: 1 1 0;
      margin-top: 0;
    }

    .checkout__payment-row .checkout__payment-label {
      justify-content: center;
    }

    .checkout__payment-radio {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .checkout__payment-label {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 0 14px;
      color: var(--cal-navy);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .checkout__payment-label::before {
      content: "";
      width: 16px;
      height: 16px;
      border: 1px solid var(--border-mid);
      border-radius: 50%;
      background: #fff;
      flex-shrink: 0;
    }

    .checkout__payment-radio:checked + .checkout__payment-label::before {
      border: 5px solid var(--cal-blue);
    }

    .checkout__payment-radio:focus-visible + .checkout__payment-label {
      outline: 2px solid var(--cal-blue);
      outline-offset: -2px;
    }

    .checkout__payment-method:has(> .checkout__payment-radio:checked) {
      border-color: #b5bbc5;
    }

    .checkout__payment-meta {
      margin-left: auto;
      font-size: 11px;
      font-weight: 500;
      color: var(--cal-slate);
    }

    .checkout__payment-details {
      display: none;
      border-top: 1px solid var(--border);
      background: #fff;
    }

    .checkout__payment-radio:checked ~ .checkout__payment-details {
      display: block;
    }

    .checkout__card-fields {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
    }

    .checkout__bank-option {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 0 14px;
      border-bottom: 1px solid var(--border);
      background: #fff;
      color: var(--cal-navy);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .checkout__bank-option:last-child {
      border-bottom: 0;
    }

    .checkout__payment-radio:checked ~ .checkout__payment-details.is-collapsed {
      display: none;
    }

    .checkout__bank-option:hover {
      background: var(--cal-blue-bg);
    }

    .checkout__bank-option input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--cal-blue);
      flex-shrink: 0;
    }

    .checkout__bank-code {
      margin-left: auto;
      padding: 3px 6px;
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--cal-slate);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .checkout__submit {
      display: none;
      height: 40px;
      margin-top: 24px;
      padding: 0 14px;
    }

    .checkout__form:has(#payment-apple:checked) .checkout__submit--payment,
    .checkout__form:has(#payment-google:checked) .checkout__submit--payment,
    .checkout__form:has(#payment-card:checked) .checkout__submit--payment,
    .checkout__form:has(#payment-bank:checked) .checkout__submit--payment,
    .checkout__form:has(#payment-on-site:checked) .checkout__submit--on-site {
      display: block;
    }

    .checkout__form:has(#payment-apple:checked) .checkout__contacts,
    .checkout__form:has(#payment-google:checked) .checkout__contacts,
    .checkout__form:has(#payment-card:checked) .checkout__contacts,
    .checkout__form:has(#payment-bank:checked) .checkout__contacts,
    .checkout__form:has(#payment-on-site:checked) .checkout__contacts {
      display: block;
    }

    .checkout__form {
      margin-top: 0;
    }

    .checkout__row {
      display: flex;
      gap: 10px;
    }

    .checkout__row .text-input { min-width: 0; }
  </style>
  
<link rel="stylesheet" href="booking-schedule.css"></head>
<body class="has-back checkout-alternative">
  

  <header class="profile profile--clinic profile--clinic--with-back"><a class="back-btn" href="option2__specialist-time.html" aria-label="Atgal">‹</a><img class="profile__photo" src="galibuti_favicon.png" alt="Galibuti logotipas"><div class="schedule__profile-copy"><p class="profile__name">Galibuti</p><p class="profile__role">Psichologijos ir psichiatrijos klinika</p></div></header>

  <main class="checkout" aria-label="Apmokėjimas" data-state="form">
    <div class="container">
      <div class="checkout-selection-cards"><a class="booking-selection-summary" href="option2__service.html" aria-label="Keisti paslaugą"><span class="booking-selection-summary__copy"><span class="booking-selection-summary__name">Psichologinis konsultavimas / psichoterapija</span><span class="booking-selection-summary__meta"><span class="booking-selection-summary__meta-main"><span class="meta-item"><svg class="meta-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> 50 min</span><span class="meta-item"><svg class="meta-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></svg> 40 €</span></span><span class="booking-selection-summary__badge">Gyvai</span></span></span><svg class="booking-selection-summary__edit" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/></svg></a><a class="booking-selection-summary booking-selection-summary--specialist" href="option2__service-selected.html" aria-label="Keisti specialistą"><img class="booking-selection-summary__photo" src="placeholder-women.jpg" alt="Irma Petraitytė"><span class="booking-selection-summary__copy"><span class="booking-selection-summary__name">Irma Petraitytė</span><span class="booking-selection-summary__meta">Psichologė</span></span><svg class="booking-selection-summary__edit" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/></svg></a><a class="booking-selection-summary booking-selection-summary--time" href="option2__specialist-selected.html" aria-label="Keisti datą ir laiką"><span class="booking-selection-summary__copy"><span class="booking-selection-summary__name">12:00 val · Tre, liepos 29</span><span class="booking-selection-summary__meta">Gyvai</span></span><svg class="booking-selection-summary__edit" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/></svg></a></div>

      <div class="checkout__step checkout__step--form">
        <form class="checkout__form" id="checkout-form">
          <h3 class="checkout__section-title">Mokėjimas</h3>
          <section class="checkout__payment-section" aria-label="Mokėjimo būdai">
            <fieldset class="checkout__payment-methods">
              <div class="checkout__payment-row">
              <div class="checkout__payment-method">
                <input class="checkout__payment-radio" type="radio" id="payment-apple" name="payment-method" value="apple-pay" required>
                <label class="checkout__payment-label" for="payment-apple">
                  <svg width="15" height="18" viewBox="0 0 16 18" fill="currentColor">
                    <path d="M13.29 9.55c-.02-2 1.64-2.97 1.71-3.01-.94-1.37-2.4-1.56-2.92-1.58-1.24-.13-2.43.73-3.06.73-.63 0-1.6-.71-2.64-.7-1.35.02-2.6.79-3.3 1.99-1.4 2.43-.36 6.02 1.01 7.99.67.96 1.47 2.04 2.52 2 1.01-.04 1.4-.65 2.62-.65 1.22 0 1.57.65 2.64.63 1.09-.02 1.78-.98 2.44-1.95.77-1.11 1.09-2.19 1.11-2.25-.02-.01-2.13-.82-2.15-3.2h.02z"/>
                    <path d="M11.35 3.44c.55-.67.92-1.6.82-2.53-.79.03-1.75.53-2.32 1.19-.51.59-.96 1.54-.84 2.44.88.07 1.79-.45 2.34-1.1z"/>
                  </svg>
                  <span>Apple Pay</span>
                </label>
              </div>

              <div class="checkout__payment-method">
                <input class="checkout__payment-radio" type="radio" id="payment-google" name="payment-method" value="google-pay">
                <label class="checkout__payment-label" for="payment-google">
                  <svg width="18" height="18" viewBox="0 0 18 18">
                    <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
                    <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/>
                    <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
                    <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
                  </svg>
                  <span>Google Pay</span>
                </label>
              </div>
              </div>

              <div class="checkout__payment-method">
                <input class="checkout__payment-radio" type="radio" id="payment-card" name="payment-method" value="card">
                <label class="checkout__payment-label" for="payment-card">
                  <span>Banko kortelė</span>
                  <span class="checkout__payment-meta">Visa · Mastercard</span>
                </label>
                <div class="checkout__payment-details">
                  <div class="checkout__card-fields">
                    <input class="text-input" type="text" inputmode="numeric" autocomplete="cc-number" placeholder="Kortelės numeris">
                    <div class="checkout__row">
                      <input class="text-input" type="text" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/YY">
                      <input class="text-input" type="text" inputmode="numeric" autocomplete="cc-csc" placeholder="CVC">
                    </div>
                    <input class="text-input" type="text" id="checkout-card-name" autocomplete="cc-name" placeholder="Kortelės savininko vardas ir pavardė">
                  </div>
                </div>
              </div>

              <div class="checkout__payment-method">
                <input class="checkout__payment-radio" type="radio" id="payment-bank" name="payment-method" value="bank">
                <label class="checkout__payment-label" for="payment-bank">
                  <span>Bankinis pavedimas</span>
                  <span class="checkout__payment-meta">8 pasirinkimai</span>
                </label>
                <div class="checkout__payment-details">
                  <label class="checkout__bank-option">
                    <input type="radio" name="bank" value="swedbank">
                    <span>Swedbank</span>
                    
                  </label>
                  <label class="checkout__bank-option">
                    <input type="radio" name="bank" value="seb">
                    <span>SEB</span>
                    
                  </label>
                  <label class="checkout__bank-option">
                    <input type="radio" name="bank" value="luminor">
                    <span>Luminor</span>
                    
                  </label>
                  <label class="checkout__bank-option">
                    <input type="radio" name="bank" value="artea">
                    <span>Artea</span>
                    
                  </label>
                  <label class="checkout__bank-option">
                    <input type="radio" name="bank" value="citadele">
                    <span>Citadele</span>
                    
                  </label>
                  <label class="checkout__bank-option">
                    <input type="radio" name="bank" value="revolut">
                    <span>Revolut</span>
                    
                  </label>
                  <label class="checkout__bank-option">
                    <input type="radio" name="bank" value="urbo">
                    <span>Urbo bankas</span>
                    
                  </label>
                  <label class="checkout__bank-option">
                    <input type="radio" name="bank" value="paysera">
                    <span>Paysera</span>
                    
                  </label>
                </div>
              </div>

              <div class="checkout__payment-method">
                <input class="checkout__payment-radio" type="radio" id="payment-on-site" name="payment-method" value="on-site">
                <label class="checkout__payment-label" for="payment-on-site">
                  <span>Grynais</span>
                  <span class="checkout__payment-meta">Vietoje</span>
                </label>
              </div>
            </fieldset>
          </section>

          <section class="checkout__contacts" aria-labelledby="checkout-contacts-title">
            <h3 class="checkout__section-title" id="checkout-contacts-title">Kontaktai</h3>
            <div class="checkout__contact-fields">
              <input class="text-input" type="text" id="checkout-name" placeholder="Vardas Pavardė" autocomplete="name" required>
              <input class="text-input" type="email" id="checkout-email" placeholder="jusu@pastas.lt" autocomplete="email" required>
              <div class="checkout__consent">
                <input type="checkbox" id="checkout-consent" required>
                <label for="checkout-consent">Sutinku su <a href="#">privatumo politika</a> ir savo asmens duomenų tvarkymu rezervacijos tikslais.</label>
              </div>
            </div>
          </section>

          <button class="pay-btn checkout__submit checkout__submit--payment" type="button">Apmokėti rezervaciją</button>
          <button class="pay-btn checkout__submit checkout__submit--on-site" type="button">Patvirtinti rezervaciją</button>
        </form>
      </div>

      <div class="checkout__step checkout__step--success">
        <div class="checkout__success-icon">✅</div>
        <h3 class="step-title">Rezervacija patvirtinta</h3>
        <p class="checkout__subtitle">Patvirtinimą ir sąskaitą išsiuntėme jūsų el. paštu.</p>
      </div>

    </div>
  </main>

<script>
const cardNameInput = document.getElementById('checkout-card-name');
const contactNameInput = document.getElementById('checkout-name');
let contactNameTouched = false;
contactNameInput.addEventListener('input', () => { contactNameTouched = true; });
cardNameInput.addEventListener('input', () => { if (!contactNameTouched) contactNameInput.value = cardNameInput.value; });
const bankList = document.querySelector('input[name="bank"]').closest('.checkout__payment-details');
const bankOptions = document.querySelectorAll('.checkout__bank-option');
const bankLabelName = document.querySelector('label[for="payment-bank"] span:first-child');
const bankLabelMeta = document.querySelector('label[for="payment-bank"] .checkout__payment-meta');
bankOptions.forEach((label) => {
  const input = label.querySelector('input');
  input.addEventListener('change', () => {
    bankList.classList.add('is-collapsed');
    bankLabelName.textContent = label.querySelector('span').textContent;
    bankLabelMeta.textContent = 'Rinktis kitą banką';
  });
});
let activePaymentMethod = null;
document.querySelectorAll('input[name="payment-method"]').forEach((input) => {
  input.addEventListener('change', () => {
    if (input.value === 'bank') {
      bankList.classList.remove('is-collapsed');
      bankLabelName.textContent = 'Bankinis pavedimas';
      bankLabelMeta.textContent = '8 pasirinkimai';
      bankOptions.forEach((l) => { l.querySelector('input').checked = false; });
    }
  });
  input.addEventListener('click', () => {
    if (activePaymentMethod === input.value) {
      input.checked = false;
      activePaymentMethod = null;
    } else {
      activePaymentMethod = input.value;
    }
  });
});</script></body>
</html>
